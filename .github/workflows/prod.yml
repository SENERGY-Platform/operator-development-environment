name: 'PROD Docker Image'

# The tag trigger is deliberately gone: this workflow now creates tags itself,
# and reacting to its own tags would be circular.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reused rather than duplicated, so the release path runs exactly the suite
  # that guards pull requests.
  test:
    uses: ./.github/workflows/tests.yml

  tag:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      new_version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tag action reads the tag history to work out the next version;
          # the default shallow clone contains none of it.
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # The image is identified solely by this tag, so an empty one would push
      # `...:` and produce either a failure or a mislabelled image. Fail here
      # instead, where the cause is legible.
      - name: Require a tag
        if: steps.tag.outputs.new_tag == ''
        run: |
          echo "::error::github-tag-action created no tag, so there is nothing to label the image with."
          exit 1

  # Builds each platform on a native runner of its own, arm64 without QEMU, and merges
  # both into one manifest under the tag.
  build:
    needs: tag
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: |
        ghcr.io/senergy-platform/operator-development-environment
      meta-tags: |
        type=raw,value=${{ needs.tag.outputs.new_tag }}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

  summary:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "Pushed \`ghcr.io/senergy-platform/operator-development-environment:${{ needs.tag.outputs.new_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
